<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎉</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url('foto.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
        }

        .gif-animasi {
            position: fixed;
            width: 150px;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            padding: 30px 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1.5s ease;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1em;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #ff6f91;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff3e6c;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            top: -10px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Responsive */
        @media (min-width: 768px) {
            h1 {
                font-size: 2.5em;
            }
            p {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>

    <!-- Musik -->
    <audio id="musik" src="happy.mp3" loop></audio>

    <div class="card">
        <img 
            id="gif"
            class="gif-animasi"
            src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExaHpxNzR5NzBsOWJlcmRqNHFwZmxlemV4azdrMXhoNHRqd2o4NHB5eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1JmGiBtqTuehfYxuy9/giphy.gif"
            alt="Happy Birthday Gif"
            style="display:none;"
        >
        <img src="foto.jpeg" alt="Foto Ulang Tahun">
        <h1>🎉 Selamat Ulang Tahun 🎉</h1>
        <p>
            Semoga hari ini penuh kebahagiaan,<br>
            sehat selalu, panjang umur,<br>
            dan semua mimpimu tercapai ✨
        </p>
        <button onclick="mulai()">Putar Musik & Kejutan 🎶</button>
    </div>

    <script>
        function mulai() {
            document.getElementById("musik").play();
            document.getElementById("gif").style.display = "block";
            buatConfetti();
        }
    
        function buatConfetti() {
            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.backgroundColor =
                    `hsl(${Math.random() * 360}, 100%, 70%)`;
                confetti.style.animationDuration =
                    Math.random() * 3 + 2 + "s";
    
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>

</body>
</html>
